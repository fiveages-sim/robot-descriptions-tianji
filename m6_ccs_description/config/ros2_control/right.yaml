# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController


arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 1000  # Hz
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: m6_ccs

    # Future time offset for trajectory prediction (in seconds)
    future_time_offset: 2.0

    # Control parameters
    home_pos: [-1.457133809892805, -1.0633699963902674, 1.1994065285584414, -0.8074199090303408, 0.6949558811978124, -0.6864381599253574, 0.1295225067208675]
    rest_pos: [-1.5708, -1.5708, 1.5708, 0.0, 0.0, 0.0, 0.0]