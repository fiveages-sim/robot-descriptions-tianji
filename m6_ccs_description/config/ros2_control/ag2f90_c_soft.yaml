# Dual-arm AG2F90-C with soft finger pads (type:=ag2f90_c_soft)
controller_manager:
  ros__parameters:
    left_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    right_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

ocs2_arm_controller:
  ros__parameters:
    robot_type: ag2f90

    home_1: [ 2.502, -1.528, -1.562, -1.680, 0.0, -0.787, 0.0,
              -2.502, -1.528, 1.562, -1.680, 0.0, -0.787, 0.0 ]
    home_2: [ 2.502, -1.528, -1.562, -1.680, 0.0, -0.787, 0.0,
              -2.502, -1.528, 1.562, -1.680, 0.0, -0.787, 0.0 ]

left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    use_effort_interface: false

right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    use_effort_interface: false
