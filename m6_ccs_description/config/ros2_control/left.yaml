# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController


arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 100  # Hz
    info_file_name: single
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: m6_ccs

    # Future time offset for trajectory prediction (in seconds)
    future_time_offset: 1.0

    # Control parameters
    home_1: [0.697135,0.185125,-0.380650,-2.504548,-1.298406,-0.256101,0.841441]
    home_2: [0.518355,-0.481237,0.099947,-1.780635,-1.163660,-0.532128,0.807533]
    home_3: [1.196480,0.061325,0.352437,-2.324074,0.007990,-0.797855,1.084214]