# Common controller defaults shared by m6_ccs ros2_control variants.

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # FT sensor broadcasters — publish left_ft_sensor / right_ft_sensor as WrenchStamped.
    # Names and sides are controlled by robot.local.yaml → xacro; broadcaster auto-detects
    # whether the sensor is declared.
    left_ft_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    right_ft_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 500  # Hz
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    future_time_offset: 1.0
    robot_name: m6_ccs
    mpc_frequency: 100

    home_1: [1.457133809892805, -1.0633699963902674, -1.1994065285584414, -0.8074199090303408, -0.6949558811978124, -0.6864381599253574, -0.1295225067208675,
             -1.457133809892805, -1.0633699963902674, 1.1994065285584414, -0.8074199090303408, 0.6949558811978124, -0.6864381599253574, 0.1295225067208675]
    home_2: [2.502, -1.528, -1.562, -1.680, 0.0, -0.787, 0.0,
             -2.502, -1.528, 1.562, -1.680, 0.0, -0.787, 0.0]

# FT sensor broadcasters — publish WrenchStamped from sensor state interfaces.
# Auto-detects sensor presence: if the URDF declares left_ft_sensor / right_ft_sensor,
# the broadcaster activates; otherwise it stays inactive. Default topics:
#   /left_ft_broadcaster/wrench  /right_ft_broadcaster/wrench
left_ft_broadcaster:
  ros__parameters:
    sensor_name: left_ft_sensor
    frame_id: left_eef

right_ft_broadcaster:
  ros__parameters:
    sensor_name: right_ft_sensor
    frame_id: right_eef
