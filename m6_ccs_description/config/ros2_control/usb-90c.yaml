# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController
    
    hand_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController


ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 1000  # Hz
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: m6_ccs
    robot_type: usb-90c
    info_file_name: usb-90c

    # Future time offset for trajectory prediction (in seconds)
    future_time_offset: 1.0

    # Control parameters
    home_pos: [-0.14572882399465162, 1.5859330686406343, 1.8827988311450752, -1.1513946609523293, -1.6226311621458172, -0.36113406474710086, -0.24404795439517177]

hand_controller:
  ros__parameters:
    update_rate: 10  # Hz
    joint: gripper_joint
    use_effort_interface: false